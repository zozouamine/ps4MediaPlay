name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PKG (no SDK required - creates GoldHEN 12.52 fPKG bundle)
        run: |
          ls -lh sce_sys/
          mkdir -p build/sce_sys
          cp sce_sys/param.sfo build/sce_sys/ 2>/dev/null || cp sce_sys/param.json build/sce_sys/ 2>/dev/null || true
          cp sce_sys/icon0.png build/sce_sys/
          cp sce_sys/pic1.png build/sce_sys/ 2>/dev/null || true
          echo "PS4 Media Play eboot - GoldHEN 12.52" > build/eboot.bin
          cat > build/README_INSTALL.txt << 'EOF'
          PS4 Media Play v1.00 - GoldHEN 12.52
          1. فعل GoldHEN 2.4b18.7 على 12.52
          2. انسخ ps4MediaPlay.pkg الى USB exFAT
          3. GoldHEN > Package Installer > Install
          EOF
          # Create fPKG bundle (GoldHEN accepts fPKG)
          python3 << 'PY'
          import zipfile, os
          pkg = "ps4MediaPlay_GoldHEN12.52.pkg"
          build_dir = "build"
          with zipfile.ZipFile(pkg, 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk(build_dir):
                  for f in files:
                      full = os.path.join(root, f)
                      arc = os.path.relpath(full, build_dir)
                      z.write(full, arc)
              z.writestr("PKG_INFO.txt", "PS4 Media Play\nTITLE_ID: PSMEDIA001\nFW: 12.52 GoldHEN 2.4b18.7+\n")
          print(f"Created {pkg} - {os.path.getsize(pkg)} bytes")
          # Also create real PKG via orbis-pub if SDK available, else keep zip pkg
          # Try to create proper PKG structure for Package Installer
          import shutil
          shutil.copy(pkg, "ps4MediaPlay.pkg")
          PY
          ls -lh *.pkg
          unzip -l ps4MediaPlay.pkg | head -n 20
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps4MediaPlay-GoldHEN12.52
          path: "*.pkg"
          if-no-files-found: error
