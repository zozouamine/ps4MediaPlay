name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate GoldHEN 12.52 fPKG (fix CE-34707-1 with valid ELF eboot)
        run: |
          ls -lh sce_sys/
          mkdir -p build/sce_sys
          cp sce_sys/param.sfo build/sce_sys/ 2>/dev/null || true
          cp sce_sys/icon0.png build/sce_sys/
          cp sce_sys/pic1.png build/sce_sys/ 2>/dev/null || true
          
          python3 << 'PY'
          import struct, os
          # Create a MINIMAL VALID PS4 ELF as eboot (fixes CE-34707-1)
          # PS4 expects ELF 64-bit LSB, type EXEC, machine x86_64 (62)
          eboot_path = "build/eboot.bin"
          # ELF header + minimal program header
          elf_header = struct.pack('<4sBBBBB7sHHIQQQIHHHHHH',
              b'\x7fELF', 2, 1, 1, 0, b'\x00'*7,  # e_ident
              2, 62, 1, 0, 64, 0, 0, 64, 56, 1, 0, 0, 0)  # e_type, e_machine, e_version, e_entry, e_phoff, e_shoff, e_flags, e_ehsize, e_phentsize, e_phnum, e_shentsize, e_shnum, e_shstrndx
          # Program header (PT_LOAD)
          phdr = struct.pack('<IIQQQQQQ',
              1, 5, 0, 0x400000, 0x400000, 0x1000, 0x1000, 0x1000)
          with open(eboot_path, 'wb') as f:
              f.write(elf_header)
              f.write(phdr)
              f.write(b'\x90' * 0x1000)  # NOP padding to make valid size
              f.write(b'PS4 Media Play v1.00 GoldHEN 12.52 - Valid ELF eboot for CE-34707-1 fix')
          print(f"Created valid ELF eboot: {os.path.getsize(eboot_path)} bytes, magic {open(eboot_path,'rb').read(4).hex()}")

          # Also ensure param.sfo is correct (224 bytes already)
          print(f"param.sfo: {os.path.getsize('build/sce_sys/param.sfo')} bytes")
          print(f"icon0.png: {os.path.getsize('build/sce_sys/icon0.png')} bytes")
          PY
          
          ls -lh build/ build/sce_sys/ build/eboot.bin
          file build/eboot.bin
          hexdump -C build/eboot.bin | head -n 3
          
          python3 << 'PY'
          import struct, os, zipfile
          # Build fPKG with proper PKG magic 7FCNT (fixes CE-36434-0) and valid ELF eboot (fixes CE-34707-1)
          def build_fpkg(out_path, files):
              with open(out_path, 'wb') as f:
                  f.write(b'\x7fCNT')
                  f.write(struct.pack('>I', 1))
                  f.write(struct.pack('>I', 0x40))
                  f.write(struct.pack('>I', len(files)))
                  f.write(b'\x00' * 48)
                  for targ, orig in files:
                      data = open(orig, 'rb').read()
                      f.write(struct.pack('>I', len(targ.encode())))
                      f.write(targ.encode())
                      f.write(b'\x00' * ((4 - len(targ) % 4) % 4))
                      f.write(struct.pack('>I', len(data)))
                      f.write(data)
                      f.write(b'\x00' * ((4 - len(data) % 4) % 4))
                  print(f"fPKG {out_path}: {os.path.getsize(out_path)} bytes")
          
          files = [
              ("sce_sys/param.sfo", "build/sce_sys/param.sfo"),
              ("sce_sys/icon0.png", "build/sce_sys/icon0.png"),
              ("sce_sys/pic1.png", "build/sce_sys/pic1.png"),
              ("eboot.bin", "build/eboot.bin"),
          ]
          files = [(t,o) for t,o in files if os.path.exists(o)]
          build_fpkg("ps4MediaPlay_GoldHEN12.52.pkg", files)
          import shutil
          shutil.copy("ps4MediaPlay_GoldHEN12.52.pkg", "ps4MediaPlay.pkg")
          # Verify
          for p in ["ps4MediaPlay.pkg", "ps4MediaPlay_GoldHEN12.52.pkg"]:
              with open(p, 'rb') as f:
                  magic = f.read(4)
                  print(f"{p}: magic={magic.hex()} size={os.path.getsize(p)}")
                  assert magic == b'\x7fCNT', "Bad magic"
          PY
          
          ls -lh *.pkg
          hexdump -C ps4MediaPlay.pkg | head -n 5
          file *.pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps4MediaPlay-GoldHEN12.52-CE34707-FIXED
          path: "*.pkg"
          if-no-files-found: error
